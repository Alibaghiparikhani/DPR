name: cross-platform-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install -r src/dag_runtime/requirements-dev.txt
      - run: python -m pytest -q
      - name: Differential harness (when bundled by audit/release CI)
        shell: bash
        run: |
          if [ -d harness ]; then
            python harness/e6_probes.py
            python harness/e14_corpus.py
            python harness/fuzz_diff.py 200 pinned
          fi
