[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpr-runtime"
version = "2.1.0"
description = "Same-LAN distributed Python runtime"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dpr = "dpr.cli:cli_entry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "*.benchmarks", "*.benchmarks.*", "*.examples", "*.examples.*",
           "tools", "tools.*"]
